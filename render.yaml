# Render Blueprint: one Python web service. Sessions live in memory, so it must
# run as a single instance with a single worker.
services:
  - type: web
    name: insurance-sop-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: CONSENT_SCENARIO
        value: default
      - key: SESSION_TTL_MINUTES
        value: "30"
